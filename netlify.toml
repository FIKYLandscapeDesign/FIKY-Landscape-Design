[build]
  publish = "."

# Pages are flat files; serve them at the usual addresses.
# force = true means these win even if old folders are still in GitHub.
[[redirects]]
  from = "/our-services/"
  to = "/our-services.html"
  status = 200
  force = true
[[redirects]]
  from = "/our-services"
  to = "/our-services.html"
  status = 200
  force = true
[[redirects]]
  from = "/contact-us/"
  to = "/contact-us.html"
  status = 200
  force = true
[[redirects]]
  from = "/contact-us"
  to = "/contact-us.html"
  status = 200
  force = true

# Old WordPress addresses
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/services/*"
  to = "/our-services/"
  status = 301
[[redirects]]
  from = "/contact/*"
  to = "/contact-us/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
