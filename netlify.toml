[build]
  publish = "."

# Old WordPress addresses people or Google may still use
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/services/*"
  to = "/our-services/"
  status = 301
[[redirects]]
  from = "/contact/*"
  to = "/contact-us/"
  status = 301
[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
